<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ice-smart-water · 符号库</title>
    <!-- 内联水滴图标：省一次 /favicon.ico 的 404（那会在控制台留一条 error，e2e 的"零报错"就废了） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5.2 6.2 9 10.6 9 15a9 9 0 0 1-18 0c0-4.4 3.8-8.8 9-15z' fill='%230d6efd'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --sw-primary: #0d6efd;
        --sw-border: #e2e8f0;
        --sw-text: #0f172a;
        --sw-muted: #64748b;
        --sw-bg: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--sw-bg);
        color: var(--sw-text);
      }
      .app-header {
        flex: none;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 10px;
        padding: 8px 14px;
        background: #fff;
        border-bottom: 1px solid var(--sw-border);
      }
      .app-brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; }
      .app-brand__name { font-size: 15px; font-weight: 700; color: var(--sw-primary); }
      .app-brand__desc { font-size: 12px; color: var(--sw-muted); }
      .nav { display: flex; gap: 6px; }
      .nav a {
        padding: 5px 10px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--sw-text);
        border: 1px solid var(--sw-border);
      }
      .nav a.is-active { background: var(--sw-primary); border-color: var(--sw-primary); color: #fff; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-left: auto; }
      button, select {
        padding: 5px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        font: inherit;
        color: inherit;
      }
      button:hover { border-color: var(--sw-primary); color: var(--sw-primary); }

      .app-main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
      .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #fff; }
      .stage canvas { display: block; }
      .stage__hint {
        position: absolute;
        left: 12px;
        bottom: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.72);
        color: #fff;
        font-size: 11px;
        pointer-events: none;
      }

      .side { border-left: 1px solid var(--sw-border); background: #fff; overflow: auto; padding: 10px 12px 24px; }
      .panel { margin-bottom: 14px; }
      .panel__title {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--sw-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .panel__title::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--sw-primary); }
      .hint { color: var(--sw-muted); font-size: 12px; }

      .detail__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
      .detail__name { font-size: 15px; font-weight: 700; }
      .detail__kind { font-size: 11px; color: var(--sw-muted); }
      .detail__row { display: grid; grid-template-columns: 68px 1fr; gap: 4px 8px; font-size: 12px; margin: 6px 0; }
      .detail__label { color: var(--sw-muted); }
      .detail__role { font-size: 12px; margin: 6px 0 10px; }
      .detail__list { margin: 0; padding-left: 18px; font-size: 12px; }
      .detail__list li { margin-bottom: 2px; }
      .detail__section { font-size: 12px; font-weight: 700; color: var(--sw-muted); margin: 10px 0 4px; }

      .chart-box { height: 220px; }
      .chart-box canvas { display: block; width: 100%; height: 100%; }

      .statusbar {
        flex: none;
        padding: 5px 14px;
        font-size: 12px;
        border-top: 1px solid var(--sw-border);
        background: #fff;
        color: var(--sw-muted);
      }
      .statusbar--ok { color: #15803d; }
      .statusbar--warning { color: #b45309; }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-brand">
        <span class="app-brand__name">ice-smart-water</span>
        <span class="app-brand__desc">给排水工艺符号库 · GB/T 50106 图例 + 工艺专业通行画法</span>
      </div>
      <nav class="nav">
        <a href="./water-editor.html">工艺流程图编辑器</a>
        <a class="is-active" href="./water-symbols.html">符号库</a>
      </nav>
      <div class="toolbar">
        <button id="btn-export">导出 SVG</button>
        <button id="btn-fit">适应视图</button>
        <button id="btn-reset">复位视图</button>
      </div>
    </header>

    <main class="app-main">
      <section class="stage">
        <canvas id="canvas-legend"></canvas>
        <div class="stage__hint">点击任意符号查看「作用 / 设计关注 / 巡检要点」· 滚轮缩放 · 空白处拖拽平移</div>
      </section>

      <aside class="side">
        <div class="panel">
          <h3 class="panel__title">筛选</h3>
          <canvas id="canvas-symbol-console"></canvas>
        </div>
        <div class="panel">
          <h3 class="panel__title">符号详情</h3>
          <div id="symbol-detail" class="hint">点击左侧图例里的任意符号查看详情</div>
        </div>
        <div class="panel">
          <h3 class="panel__title">符号库构成</h3>
          <div class="chart-box"><canvas id="canvas-symbol-mix"></canvas></div>
        </div>
      </aside>
    </main>

    <footer class="statusbar" id="statusbar">正在生成图例…</footer>
  </body>
</html>
