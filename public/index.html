<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ice-smart-water · 智慧水务运行控制台</title>
    <!-- 内联水滴图标：省一次 /favicon.ico 的 404（那会在控制台留一条 error，e2e 的"零报错"就废了） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5.2 6.2 9 10.6 9 15a9 9 0 0 1-18 0c0-4.4 3.8-8.8 9-15z' fill='%230d6efd'/%3E%3C/svg%3E"
    />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #eef1f4;
        color: #212529;
      }
      /* 整个系统只有这一张画布：侧栏 / 顶栏 / 卡片 / 表格全画在它上面 */
      canvas#canvas-shell {
        display: block;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.175);
      }
      /* 登录层：盖在整张画布之上的另一层画布（不透明底色，登录成功后整层隐藏） */
      canvas#canvas-login {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 20;
        display: block;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.175);
      }
      /* 消息覆盖画布：位于所有「岛」画布之上、登录层之下。
         外壳画布在 DOM 里位于岛之下，画在外壳上的顶部消息堆进岛的区域会被岛盖住；
         这张画布专门画消息，pointer-events:none（顶部消息无需交互，也不挡外壳/岛的点击）。 */
      canvas#canvas-overlay {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 15;
        display: block;
        border-radius: 14px;
        pointer-events: none;
      }
      .app {
        /* display:block：inline-block 会在行盒里留出基线间隙，让页面多出几像素纵向滚动条 */
        display: block;
        position: relative;
        width: fit-content;
      }
      /* 岛：需要独立 ICE 实例的画布区域（工艺图 / 24 小时看板 / 符号图例），
         由脚本按外壳坐标绝对定位，嵌在卡片挖好的"洞"里 */
      .island {
        position: absolute;
        overflow: hidden;
        border-radius: 10px;
      }
      .island canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* ===== 启动遮罩 =====
         纯 HTML/CSS，**先于任何 JS 显示**：首屏要下载 + 解析 + 执行约 1.4MB 的包
         （四个家族包内联），再加上开机就建 12 个页签的内容，冷启动要好几秒。
         没有它的时候用户先看到的是 canvas 的**默认尺寸 300×150** —— 也就是左上角那个
         突兀的白色圆角矩形（实测：1.6Mbps + 4× CPU 降速下要 7.5 秒才出登录门）。 */
      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 100; /* 盖住外壳、登录层（20）与所有岛（15） */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #eef1f4; /* 与 body 同色：遮罩就是"页面还没画出来"的样子 */
        /* 不拦点击：加载期间本来没有可点的东西；拦点击反而会让 e2e 里
           「elementFromPoint 命中登录画布」这类断言失败 */
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0s linear 0.25s;
      }
      body.is-booting #boot-overlay {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.25s ease;
      }
      /* 启动期间把应用整个藏起来：canvas 没写 width/height 属性时默认 300×150，
         不藏就会先闪一个左上角的白色矩形（遮罩万一没盖上也不该露） */
      body.is-booting .app {
        visibility: hidden;
      }
      .boot-drop {
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        margin-top: 6px;
        border: 3px solid rgba(13, 110, 253, 0.22);
        border-top-color: #0d6efd;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-title {
        font-size: 17px;
        font-weight: 600;
        color: #212529;
      }
      .boot-status {
        min-height: 20px;
        font-size: 13px;
        color: #6c757d;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.85;
        }
        50% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      /* 无障碍：系统开了"减少动态效果"就不转 */
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner,
        .boot-drop {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="is-booting">
    <div class="app">
      <canvas id="canvas-shell"></canvas>
      <canvas id="canvas-login"></canvas>
      <div class="island" id="island-process"><canvas id="canvas-process"></canvas></div>
      <div class="island" id="island-board"><canvas id="canvas-board"></canvas></div>
      <div class="island" id="island-legend"><canvas id="canvas-legend"></canvas></div>
      <div class="island" id="island-live-trend"><canvas id="canvas-live-trend"></canvas></div>
      <div class="island" id="island-live-gauge"><canvas id="canvas-live-gauge"></canvas></div>
      <div class="island" id="island-live-heat"><canvas id="canvas-live-heat"></canvas></div>
      <div class="island" id="island-calc-curve"><canvas id="canvas-calc-curve"></canvas></div>
      <div class="island" id="island-sludge-flow"><canvas id="canvas-sludge-flow"></canvas></div>
      <div class="island" id="island-asset-health"><canvas id="canvas-asset-health"></canvas></div>
      <div class="island" id="island-inspection-route"><canvas id="canvas-inspection-route"></canvas></div>
      <div class="island" id="island-energy-mix"><canvas id="canvas-energy-mix"></canvas></div>
      <div class="island" id="island-energy-tariff"><canvas id="canvas-energy-tariff"></canvas></div>
      <div class="island" id="island-pump-curve"><canvas id="canvas-pump-curve"></canvas></div>
      <div class="island" id="island-sump-level"><canvas id="canvas-sump-level"></canvas></div>
      <div class="island" id="island-drill-compare"><canvas id="canvas-drill-compare"></canvas></div>
      <!-- 顶部消息专用的覆盖画布：在所有岛之上（见上面的 CSS） -->
      <canvas id="canvas-overlay"></canvas>
    </div>
    <!-- 启动遮罩：纯 HTML/CSS，先于任何 JS 显示；由 app 在首帧之后撤下（src/view/boot-overlay.ts） -->
    <div id="boot-overlay" role="status" aria-live="polite" aria-label="正在加载智慧水务运行控制台">
      <svg class="boot-drop" width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3c5.2 6.2 9 10.6 9 15a9 9 0 0 1-18 0c0-4.4 3.8-8.8 9-15z" fill="#0d6efd" />
      </svg>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-title">智慧水务运行控制台</div>
      <div class="boot-status" id="boot-status">正在加载渲染引擎与组件库…</div>
    </div>
    <script>
      // 加载明显偏慢时给一句解释（纯内联，不依赖 bundle）；是否可见由 body 的 class 决定
      setTimeout(function () {
        var status = document.getElementById('boot-status');
        if (status && document.body.classList.contains('is-booting')) {
          status.textContent = '首次加载需要解析约 1.4MB 渲染引擎与组件库，请稍候…';
        }
      }, 6000);
    </script>
  </body>
</html>
