<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ice-smart-water · 智慧水务运行控制台</title>
    <!-- 内联水滴图标：省一次 /favicon.ico 的 404（那会在控制台留一条 error，e2e 的"零报错"就废了） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5.2 6.2 9 10.6 9 15a9 9 0 0 1-18 0c0-4.4 3.8-8.8 9-15z' fill='%230d6efd'/%3E%3C/svg%3E"
    />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #eef1f4;
        color: #212529;
      }
      /* 整个系统只有这一张画布：侧栏 / 顶栏 / 卡片 / 表格全画在它上面 */
      canvas#canvas-shell {
        display: block;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.175);
      }
      /* 登录层：盖在整张画布之上的另一层画布（不透明底色，登录成功后整层隐藏） */
      canvas#canvas-login {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 20;
        display: block;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.175);
      }
      /* 消息覆盖画布：位于所有「岛」画布之上、登录层之下。
         外壳画布在 DOM 里位于岛之下，画在外壳上的顶部消息堆进岛的区域会被岛盖住；
         这张画布专门画消息，pointer-events:none（顶部消息无需交互，也不挡外壳/岛的点击）。 */
      canvas#canvas-overlay {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 15;
        display: block;
        border-radius: 14px;
        pointer-events: none;
      }
      .app {
        /* display:block：inline-block 会在行盒里留出基线间隙，让页面多出几像素纵向滚动条 */
        display: block;
        position: relative;
        width: fit-content;
      }
      /* 岛：需要独立 ICE 实例的画布区域（工艺图 / 24 小时看板 / 符号图例），
         由脚本按外壳坐标绝对定位，嵌在卡片挖好的"洞"里 */
      .island {
        position: absolute;
        overflow: hidden;
        border-radius: 10px;
      }
      .island canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <canvas id="canvas-shell"></canvas>
      <canvas id="canvas-login"></canvas>
      <div class="island" id="island-process"><canvas id="canvas-process"></canvas></div>
      <div class="island" id="island-board"><canvas id="canvas-board"></canvas></div>
      <div class="island" id="island-legend"><canvas id="canvas-legend"></canvas></div>
      <div class="island" id="island-live-trend"><canvas id="canvas-live-trend"></canvas></div>
      <div class="island" id="island-live-gauge"><canvas id="canvas-live-gauge"></canvas></div>
      <div class="island" id="island-live-heat"><canvas id="canvas-live-heat"></canvas></div>
      <div class="island" id="island-calc-curve"><canvas id="canvas-calc-curve"></canvas></div>
      <!-- 顶部消息专用的覆盖画布：在所有岛之上（见上面的 CSS） -->
      <canvas id="canvas-overlay"></canvas>
    </div>
  </body>
</html>
